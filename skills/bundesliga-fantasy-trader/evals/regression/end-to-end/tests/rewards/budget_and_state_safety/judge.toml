[judge]
judge = "anthropic/claude-sonnet-4-6"
files = [
  "/logs/artifacts/report.md",
  "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/snapshot/squad.md",
  "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/snapshot/evidence.md",
]

[[criterion]]
description = "Rate whether the report handles budget uncertainty, roster legality, and mutable state safely. Full credit requires treating 3.34M as the spendable bank and 155.13M only as squad market value, never as cash; distinguishing observed, dated estimated, and unknown live prices without inventing values; and leading with one highest-potential slate rather than asking for exact sell values, constructing affordability thresholds, or supplying a proactive downgrade ladder. It should invite the user to report the app's shortfall if the slate fails, so the next-best slate can be produced then. The report should preserve the five-transfer allowance, allowed positional ranges, and three-player club limit, and it must keep all moves proposed rather than claiming execution or completion. Remember that the squad must own 4–6 defenders, but a legal 3-5-2 Top 11 formation uses three starting defenders."
type = "likert"
points = 5
