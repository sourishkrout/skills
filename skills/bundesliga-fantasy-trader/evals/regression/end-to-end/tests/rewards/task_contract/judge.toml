[judge]
judge = "anthropic/claude-sonnet-4-6"
files = [
  "/logs/artifacts/report.md",
  "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/snapshot/squad.md",
  "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/snapshot/evidence.md",
]

[[criterion]]
description = "Rate whether the report fulfills the requested Matchday 4 deliverable. It should lead with a compact Discord-suitable action summary; audit all 15 confirmed players; give one strongest proposed transfer slate in execution order without a proactive cheaper fallback, affordability ladder, or request for exact sell values; show transfer-count, concise budget uncertainty, positional-composition, and club-limit checks; and provide a formation, provisional XI, bench, and exactly one defender, midfielder, and forward star for Top 11 mode. When exact sell values are unknown, it should tell the user to try the slate and report the app's shortfall if it does not fit so a revised slate can be produced then. It should also give the deadline in fixture-local time, UTC, and America/Los_Angeles. Judge meaning rather than exact headings, arrow characters, or stock phrases. Remember that 4–6 defenders is the 15-player squad constraint, while a legal 3-5-2 Top 11 formation starts three defenders."
type = "likert"
points = 5
