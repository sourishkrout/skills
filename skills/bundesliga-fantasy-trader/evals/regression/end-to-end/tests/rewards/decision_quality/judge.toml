[judge]
judge = "anthropic/claude-sonnet-4-6"
files = [
  "/logs/artifacts/report.md",
  "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/snapshot/squad.md",
  "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/snapshot/evidence.md",
]

[[criterion]]
description = "Rate the quality and executability of the proposed Bundesliga Fantasy Matchday 4 plan. A strong report audits the confirmed squad, prioritizes evidence-backed minutes or fixture problems, gives one concrete highest-potential player-out to player-in slate, preserves the five-transfer allowance, stays within the allowed positional ranges and three-player club limit, keeps price uncertainty concise, and chooses a coherent formation, provisional XI, bench, and one defender, midfielder, and forward star for Top 11 mode. It should defer cheaper alternatives and detailed budget troubleshooting until the user reports that the slate does not fit. Defensible alternatives and natural variations in wording or organization should receive full credit. Penalize menus, proactive fallback ladders, requests for exact sell values before the first slate, unsupported churn, illegal composition, or recommendations that do not follow from the frozen evidence. The 4–6 defender rule governs the 15-player squad; it does not make a 3-5-2 Top 11 formation illegal."
type = "likert"
points = 5
