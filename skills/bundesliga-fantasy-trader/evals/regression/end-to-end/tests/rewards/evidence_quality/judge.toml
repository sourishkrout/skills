[[criterion]]
description = "Rate whether every actionable sell, buy, hold, formation, and star decision is traceable to dated evidence in the frozen pre-Matchday 4 snapshot. Reward adjacent citations or unmistakable source attribution, correct separation of official facts from expert analysis and model projections, honest treatment of the older-versus-later Kane and Olise projection disagreement, and clear price labels of observed, estimated, or unknown. Penalize fabricated facts or values, source-name dropping without connection to an action, treating TheFantasyTool as authoritative, or relying on information not present in the snapshot."
