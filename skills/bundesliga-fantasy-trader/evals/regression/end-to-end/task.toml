build_timeout_sec = 600.0
os = "linux"
workdir = "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir"
skills_dir = "/app/skills/bundesliga-fantasy-trader/evals/regression/end-to-end/workdir/.agents/skills"
mcp_servers = []

[environment.env]

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[solution.env]
